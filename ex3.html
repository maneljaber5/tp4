<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inscription</title>
</head>
<body>
<form action="traitement.php" method="post">
<label for="cin">Numéro CIN :</label>
<input type="text" id="cin" name="cin" maxlength="8" pattern="[0-9]{8}" required>
<br><br>
<label for="nom">Nom et prénom :</label>
<input type="text" id="nom" name="nom" maxlength="40" required>
<br><br>
<label for="naissance">Date et heure de naissance :</label>
<input type="datetime-local" id="naissance" name="naissance">
<br><br>
<label for="moyenne">Moyenne de l'année dernière :</label>
<input type="number" id="moyenne" name="moyenne" min="0" max="20" step="0.01">
<br><br>
<label for="inscription">Date d'inscription :</label>
<input type="date" id="inscription" name="inscription">
<br><br>
<label for="parcours">Parcours et niveau :</label>
<select id="parcours" name="parcours">
<optgroup label="TC">
<option value="TC1">1er</option>
<option value="TC2">2ème</option>
<option value="TC3">3ème</option>
</optgroup>
<optgroup label="SEM">
<option value="SEM1">1er</option>
<option value="SEM2">2ème</option>
<option value="SEM3">3ème</option>
</optgroup>
<optgroup label="DSI">
<option value="DSI1">1er</option>
<option value="DSI2">2ème</option>
<option value="DSI3">3ème</option>
</optgroup>
<optgroup label="RSI">
<option value="RSI1">1er</option>

<option value="RSI2">2ème</option>
<option value="RSI3">3ème</option>
</optgroup>
</select>
<br><br>
<input type="submit" value="Envoyer">
<input type="reset" value="Réinitialiser">
</form>
</body>
</html>
